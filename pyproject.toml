[project]
name = "achlens"
version = "0.1.0"
description = "A local-first ACH file validation foundation."
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { file = "LICENSE" }
authors = [{ name = "achlens contributors" }]
dependencies = [
    "mcp>=2.2,<3.0",
    "pyyaml>=6.0,<7.0",
    "typer>=0.12,<1.0",
]

[project.scripts]
achlens = "achlens.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.11,<2.0",
    "pip-audit>=2.7,<3.0",
    "pytest>=8.0,<9.0",
    "pytest-cov>=5.0,<7.0",
    "ruff>=0.6,<1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/achlens"]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
strict = true
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]

name: Bug report
description: Report a reproducible defect in achlens
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Use synthetic data only. Do not include secrets, payment data, or real ACH files.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating system and Python version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Include the command or API surface and a minimal synthetic example.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
    validations:
      required: true
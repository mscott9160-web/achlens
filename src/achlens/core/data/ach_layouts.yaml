    required: false
    note: Blank
  - name: trace_number
    start: 80
    end: 94
    length: 15
    type: N
    required: true
  addenda_99_return:
  - name: record_type_code
    start: 1
    end: 1
    length: 1
    type: N
    required: true
    note: Constant "7"
  - name: addenda_type_code
    start: 2
    end: 3
    length: 2
    type: N
    required: true
    note: '"99"'
  - name: return_reason_code
    start: 4
    end: 6
    length: 3
    type: AN
    required: true
    note: R01 etc.
  - name: original_entry_trace_number
    start: 7
    end: 21
    length: 15
    type: N
    required: true
  - name: date_of_death
    start: 22
    end: 27

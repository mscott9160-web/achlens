  - name: total_credit_entry_dollar_amount
    start: 33
    end: 44
    length: 12
    type: N
    required: true
    note: Cents
  - name: company_identification
    start: 45
    end: 54
    length: 10
    type: AN
    required: true
    note: Must match batch header
  - name: message_authentication_code
    start: 55
    end: 73
    length: 19
    type: AN
    required: false
    note: Blank
  - name: reserved
    start: 74
    end: 79
    length: 6
    type: AN
    required: false
    note: Blank
  - name: originating_dfi_identification
    start: 80
    end: 87
    length: 8
    type: N
    required: true
    note: Must match batch header
  - name: batch_number
    start: 88
    end: 94
    length: 7
    type: N
    required: true

# achlens rule catalog. Descriptions are original paraphrases; sources remain unverified.
- &defaults
  template: true
  category: S
  severity: error
  title: ACH structure rule
  description: achlens convention for ACH structure validation.
  fix_hint: Review the affected record and preserve the fixed-width ACH format.
  applies_to: [all]
  source: achlens convention
  status: UNVERIFIED

- id: S001
  <<: *defaults
  title: Record length is 94 characters
  description: Every record line must contain exactly 94 characters.
  fix_hint: Editors may strip trailing spaces when lines are short; restore missing characters when they are blank.
- id: S002
  <<: *defaults
  title: Printable record characters
  description: Records contain only printable ASCII characters from 0x20 through 0x7E.
- id: S003
  <<: *defaults
  title: Known record type
  description: The first character identifies a known ACH record type.
- id: S004
  <<: *defaults
  title: File begins with header
  description: The first record is a file header record.
- id: S005
  <<: *defaults
  title: Exactly one file header
  description: The file contains exactly one file header.
- id: S006
  <<: *defaults
  title: Record order is valid
  description: Entry, addenda, batch control, and batch header records occur in valid order.
- id: S007
  <<: *defaults
  title: Batches contain entries
  description: Every batch contains at least one entry detail record.
- id: S008
  <<: *defaults
  title: File control is present
  description: The file contains a file control record.
- id: S009
  <<: *defaults
  title: Only padding follows file control
  description: No non-padding record follows the file control record.
- id: S010
  <<: *defaults
  title: Padding records are valid
  description: Each padding record consists of exactly 94 nines.
- id: S011
  <<: *defaults
  title: Line count is blocked
  description: Total record count is a multiple of ten.
- id: S012
  <<: *defaults
  title: Padding is necessary
  description: Padding is no more than nine lines and reaches the next block boundary.
- id: S013
  <<: *defaults
  severity: warning
  title: Line endings are consistent
  description: Records use a consistent line ending convention.
- id: S014
  <<: *defaults
  title: File is not empty
  description: The ACH file contains at least one record.

